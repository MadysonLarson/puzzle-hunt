<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlocking Piece...</title>
</head> 
<body>
    <h1>Unlocking Piece... Please wait!</h1>

    <script>
        // CHANGE THIS NUMBER FOR EACH FILE (e.g., "4" for piece4.html)
        const pieceNumber = "5"; 

        // 1. Save this specific piece and set it as the active video to play
        localStorage.setItem(`puzzle_piece_${pieceNumber}`, "unlocked");
        localStorage.setItem("active_video_piece", pieceNumber);

        // 2. Instantly send the user back to your main puzzle screen
        window.location.href = "index.html";
    </script>
</body>
</html>
