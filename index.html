<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6-Piece QR Video Puzzle Hunt</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 20px;
        }
        #video-container {
            max-width: 560px;
            margin: 0 auto 20px;
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
        }
        #player {
            width: 100%;
            height: 100%;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-gap: 4px;
            justify-content: center;
            margin: 20px auto;
        }
        .tile {
            width: 110px;
            height: 110px;
            background: #ddd;
            border: 1px dashed #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #777;
            overflow: hidden;
        }
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .tile.unlocked img {
            display: block;
        }
        .tile.unlocked span {
            display: none;
        }
        #msg {
            color: #2e7d32;
            font-weight: bold;
            margin-top: 15px;
            min-height: 20px;
            font-size: 1.1em;
        }
        .reset-btn {
            margin-top: 20px;
            padding: 8px 16px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Scan & Watch to Unlock</h1>

    <!-- The Video Player Framework -->
    <div id="video-container">
        <div id="player"></div>
    </div>
    
    <div id="msg"></div>

    <h2>Your Puzzle Progress</h2>

    <!-- 6-Piece Grid Visual Layout (Change src names to match your uploaded files) -->
    <div class="grid">
        <div class="tile" id="tile1"><span>1</span><img src="gold1.jpg"></div>
        <div class="tile" id="tile2"><span>2</span><img src="gold2.jpg"></div>
        <div class="tile" id="tile3"><span>3</span><img src="gold3.jpg"></div>
        <div class="tile" id="tile4"><span>4</span><img src="gold4.jpg"></div>
        <div class="tile" id="tile5"><span>5</span><img src="gold5.jpg"></div>
        <div class="tile" id="tile6"><span>6</span><img src="gold6.jpg"></div>
    </div>

    <button class="reset-btn" onclick="resetGame()">Reset Game Progress</button>

    <!-- Official YouTube API Link -->
    <script src="https://youtube.com"></script>
    <script>
        // 1. CONFIGURATION: Swap these out with your 6 unlisted YouTube Video IDs
        const videoMap = {
            "1": "4eTXY6EdA3w",
            "2": "kJQP7kiw5Fk",
            "3": "dQw4w9WgXcQ",
            "4": "kJQP7kiw5Fk",
            "5": "dQw4w9WgXcQ",
            "6": "kJQP7kiw5Fk"
        };

        let player;
        let activePiece = "1"; // Default starting piece if history is empty

        // 2. Checks browser storage to unlock tiles and select the correct video
        function checkProgress() {
            let unlockedCount = 0;

            // Unlock all tiles that have been scanned in the past
            for (let i = 1; i <= 6; i++) {
                if (localStorage.getItem(`puzzle_piece_${i}`) === "unlocked") {
                    const tile = document.getElementById(`tile${i}`);
                    if (tile) {
                        tile.classList.add("unlocked");
                        unlockedCount++;
                    }
                }
            }

            // Find which video should be playing right now based on the last scan
            const lastScanned = localStorage.getItem("active_video_piece");
            if (lastScanned) {
                activePiece = lastScanned;
            }

            const msgDiv = document.getElementById("msg");
            if (msgDiv) {
                if (unlockedCount === 6) {
                    msgDiv.innerText = "🎉 Congratulations! You unlocked the entire puzzle!";
                } else {
                    msgDiv.innerText = `You have unlocked ${unlockedCount} out of 6 pieces. Keep scanning!`;
                }
            }
        }

        // 3. Initializing the YouTube Video Embed Frame
        function onYouTubeIframeAPIReady() {
            checkProgress(); // Run setup checks first

            let targetVideoId = videoMap[activePiece];

            player = new YT.Player('player', {
                videoId: targetVideoId,
                playerVars: {
                    'autoplay': 1,       // Request system autoplay
                    'playsinline': 1,    // Prevents forced mobile fullscreen video wraps
                    'controls': 1        // Allows player to scrub timeline or unmute
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 4. Autoplay Bypass Logic
        function onPlayerReady(event) {
            event.target.mute();      // Browsers require video to be muted to force autoplay
            event.target.playVideo(); 
            
            const msgDiv = document.getElementById("msg");
            if (msgDiv && (msgDiv.innerText.indexOf("unlocked") > -1 || msgDiv.innerText === "")) {
                msgDiv.innerHTML = "🔊 Video playing! Tap the video screen speaker to turn on game audio.";
            }
        }

        // 5. Helper clear button function
        function resetGame() {
            localStorage.clear(); // Clears all saved pieces and video selections
            window.location.reload();
        }
    </script>
</body>
</html>
